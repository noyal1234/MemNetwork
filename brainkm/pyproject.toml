[project]
name = "brainkm"
version = "0.1.0"
description = "MemNetwork — local project brain MCP server (SQLite FTS5 + graph memory)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MemNetwork" }]
keywords = ["mcp", "cursor", "memory", "sqlite", "agent"]
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "ulid-py>=1.1.0",
    "watchdog>=4.0.0",
    "tiktoken>=0.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
semantic = [
    "onnxruntime>=1.19.0",
    "sqlite-vec>=0.1.6",
]
ollama = [
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]
cloud = [
    "httpx>=0.27.0",
]
graphify = [
    "graphifyy>=0.8.48",
]

[project.scripts]
brainkm = "brainkm.cli:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainkm*"]

[tool.setuptools.package-data]
brainkm = [
    "db/migrations/*.sql",
    "hooks/cursor/*.json",
    "hooks/cursor/*.mdc",
    "hooks/claude/*.json",
    "config.example.json",
    "bench/fixtures/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
