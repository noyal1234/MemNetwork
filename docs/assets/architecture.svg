    <text x="16" y="28" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5eb8a8" letter-spacing="1">LOGICAL LIFECYCLE</text>
    <text x="164" y="28" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7a90a4">event names vary by host - same brain</text>
