  </line>

  <circle r="2.8" fill="#5eb8a8" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M648,157 L624,157 L336,157 L312,157"/>
  </circle>
  <circle r="2.8" fill="#c4a35a" filter="url(#glow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M312,441.0 L336,441.0 L624,441.0 L648,441.0"/>
  </circle>

