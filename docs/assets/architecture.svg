      <circle cx="261" cy="70" r="12" fill="#0f1419" stroke="#5eb8a8" stroke-width="1.5">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
      </circle>
      <text x="261" y="70" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5eb8a8">2</text>
      <text x="281" y="70" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f4f8">Work</text>
      <text x="253" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9aafc0">MCP + Pre/PostToolUse</text>
