      <circle cx="38" cy="70" r="12" fill="#0f1419" stroke="#5eb8a8" stroke-width="1.5">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.00s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="70" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5eb8a8">1</text>
