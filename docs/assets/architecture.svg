    <line x1="452" y1="88" x2="460" y2="88" stroke="#3d4a5c" stroke-width="2" stroke-dasharray="3 3"/>
    <g>
      <rect x="462" y="44" width="211" height="88" rx="10" fill="#141c28" stroke="#c4a35a" stroke-width="1.2"/>
      <circle cx="484" cy="70" r="12" fill="#0f1419" stroke="#c4a35a" stroke-width="1.5">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.70s" repeatCount="indefinite"/>
