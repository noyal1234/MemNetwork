    <text x="80" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0f4f8">brain.db</text>
    <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">SQLite FTS5 + graph tables</text>
    <text x="80" y="110" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">neurons · code nodes/edges</text>
    <text x="80" y="128" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">chunks · commit-session joins</text>
    <text x="80" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c4a35a">remember_neuron (redacted)</text>

    <rect x="16" y="180" width="256" height="96" rx="10" fill="#141c28" stroke="#3d4a5c"/>
    <circle cx="44" cy="214" r="5" fill="#5eb8a8"/>
    <circle cx="64" cy="232" r="4.5" fill="#3d9a8b"/>
    <circle cx="42" cy="250" r="4" fill="#7ec8bb"/>
