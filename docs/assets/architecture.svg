    <line x1="44" y1="214" x2="42" y2="250" stroke="#5eb8a8" stroke-width="1.2" opacity="0.55"/>
    <line x1="64" y1="232" x2="42" y2="250" stroke="#5eb8a8" stroke-width="1" opacity="0.45"/>
    <text x="84" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0f4f8">Graphify AST</text>
    <text x="84" y="236" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">Extract -&gt; graph.json -&gt; import</text>
    <text x="84" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">PostToolUse queues Write/Edit sync</text>

    <rect x="16" y="330" width="256" height="46" rx="8" fill="#0f1419" stroke="#2a3a4d"/>
    <text x="144.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">adapters/ graphify · distill</text>
    <text x="144.0" y="366" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">transcripts · redaction · embeddings</text>
  </g>

  <!-- gutters -->
  <line x1="335" y1="157" x2="313" y2="157" stroke="#5eb8a8" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowPull)">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="647" y1="157" x2="625" y2="157" stroke="#5eb8a8" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowPull)">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="313" y1="441.0" x2="335" y2="441.0" stroke="#c4a35a" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowPush)">
