    <!-- design notes: three equal columns inside footer (pad 16 · width 880) -->
    <rect x="16" y="144" width="880" height="40" rx="6" fill="#0f1419" stroke="#2a3a4d"/>
    <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
