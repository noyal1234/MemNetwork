<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">MemNetwork architecture</title>
  <desc id="desc">IDE hooks and MCP tools share a local SQLite brain. Host event names differ; the store does not.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1419"/><stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2a3a"/><stop offset="100%" stop-color="#16202c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d9a8b"/><stop offset="100%" stop-color="#5eb8a8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowPull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eb8a8"/>
    </marker>
    <marker id="arrowPush" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4a35a"/>
    </marker>
  </defs>

  <rect width="960" height="720" rx="14" fill="url(#bg)"/>

  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Architecture</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9aafc0">Local SQLite brain · tool -&gt; service -&gt; adapter · inject / handover / distill</text>
  <rect x="24" y="64" width="56" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">
    <line x1="700" y1="30" x2="722" y2="30" stroke="#5eb8a8" stroke-width="2.5" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <text x="732" y="34">OUT - inject + packs</text>
    <line x1="700" y1="50" x2="722" y2="50" stroke="#c4a35a" stroke-width="2.5" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <text x="732" y="54">IN - handover / distill</text>
  </g>

  <!-- COL 1 -->
  <g transform="translate(24,88)">
    <rect width="288" height="392" rx="12" fill="url(#panel)" stroke="#2a3a4d" stroke-width="1.5"/>
    <text x="16" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5eb8a8" letter-spacing="1">AGENT HOSTS</text>
    <text x="16" y="40" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">Hooks differ - same .brain/</text>
    <g>
      <rect x="16" y="50" width="256" height="47" rx="8" fill="#141c28" stroke="#3d4a5c"/>
      <circle cx="36" cy="73.5" r="7" fill="#1a2332" stroke="#e8eef4" stroke-width="1.5"/>
      <text x="54" y="66.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f4f8">Cursor</text>
      <text x="54" y="84.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">SessionStart/End · PreCompact</text>
    </g><g>
      <rect x="16" y="105" width="256" height="47" rx="8" fill="#141c28" stroke="#3d4a5c"/>
      <circle cx="36" cy="128.5" r="7" fill="#1a2332" stroke="#4285F4" stroke-width="1.5"/>
      <text x="54" y="121.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f4f8">Antigravity</text>
      <text x="54" y="139.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">PreInvocation · Stop distill</text>
    </g><g>
      <rect x="16" y="160" width="256" height="47" rx="8" fill="#141c28" stroke="#3d4a5c"/>
      <circle cx="36" cy="183.5" r="7" fill="#1a2332" stroke="#D97706" stroke-width="1.5"/>
      <text x="54" y="176.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f4f8">Claude Code</text>
      <text x="54" y="194.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">Pre/PostCompact · Subagent</text>
    </g><g>
      <rect x="16" y="215" width="256" height="47" rx="8" fill="#141c28" stroke="#3d4a5c"/>
      <circle cx="36" cy="238.5" r="7" fill="#1a2332" stroke="#00A67E" stroke-width="1.5"/>
      <text x="54" y="231.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f4f8">Codex</text>
      <text x="54" y="249.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a90a4">Stop -> session-end</text>
    </g><g>
  <rect x="16" y="270" width="256" height="47" rx="8" fill="#0f1419" stroke="#3d9a8b" stroke-dasharray="4 3"/>
  <text x="144.0" y="287.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5eb8a8">+ Generic MCP</text>
  <text x="144.0" y="305.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9aafc0">stdio / HTTP · manual capture</text>
</g>
    <rect x="16" y="330" width="256" height="46" rx="8" fill="#0f1419" stroke="#2a3a4d"/>
    <text x="144.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">Locate = host Grep / index</text>
    <text x="144.0" y="366" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">Flow = traverse / context_pack</text>
  </g>

  <!-- COL 2 -->
  <g transform="translate(336,88)">
    <rect width="288" height="392" rx="12" fill="url(#panel)" stroke="#3d9a8b" stroke-width="1.5"/>
    <text x="16" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5eb8a8" letter-spacing="1">BRAINKM RUNTIME</text>

    <!-- equal entry cards: pad 16, gap 16, width 120 each (16+120+16+120+16=288) -->
    <g>
      <rect x="16" y="40" width="120" height="58" rx="8" fill="#141c28" stroke="#5eb8a8" stroke-width="1.3"/>
      <circle cx="76" cy="52" r="4.5" fill="#3d9a8b">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f0f4f8">MCP server</text>
      <text x="76" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9aafc0">6 tools · stdio / HTTP</text>
    </g>
    <g>
      <rect x="152" y="40" width="120" height="58" rx="8" fill="#141c28" stroke="#c4a35a" stroke-width="1.3"/>
      <circle cx="212" cy="52" r="4.5" fill="#c4a35a">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="212" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f0f4f8">Hook CLI</text>
      <text x="212" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#9aafc0">inject · handover · distill</text>
    </g>

    <text x="16" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#7a90a4">MCP TOOLS</text>
    <rect x="16" y="128" width="80" height="24" rx="5" fill="#141c28" stroke="#3d4a5c"/><text x="56.0" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#c8d6e0">recall</text><rect x="104" y="128" width="80" height="24" rx="5" fill="#141c28" stroke="#3d4a5c"/><text x="144.0" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#c8d6e0">context_pack</text><rect x="192" y="128" width="80" height="24" rx="5" fill="#141c28" stroke="#3d4a5c"/><text x="232.0" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#c8d6e0">traverse</text><rect x="16" y="160" width="80" height="24" rx="5" fill="#141c28" stroke="#3d4a5c"/><text x="56.0" y="176" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#c8d6e0">remember</text><rect x="104" y="160" width="80" height="24" rx="5" fill="#141c28" stroke="#3d4a5c"/><text x="144.0" y="176" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#c8d6e0">trace_changes</text><rect x="192" y="160" width="80" height="24" rx="5" fill="#141c28" stroke="#3d4a5c"/><text x="232.0" y="176" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#c8d6e0">brain_stats</text>

    <text x="16" y="208" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#7a90a4">LAYERING</text>
    <rect x="16" y="216" width="256" height="36" rx="8" fill="#141c28" stroke="#2a3a4d"/>
    <text x="144.0" y="239" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5eb8a8">tool -&gt; service -&gt; adapter -&gt; SQLite</text>

    <text x="16" y="276" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#7a90a4">SERVICES</text>
    <text x="16" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">memory · recall · context_pack · capture</text>
    <text x="16" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aafc0">hooks · handover · budget · WriteQueue</text>

    <rect x="16" y="330" width="256" height="46" rx="8" fill="#0f1419" stroke="#3d9a8b" stroke-width="1.2">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="144.0" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5eb8a8">budget.total_tokens = 1500</text>
    <text x="144.0" y="366" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9aafc0">Hard default cap on agent packs</text>
  </g>

  <!-- COL 3 -->
  <g transform="translate(648,88)">
    <rect width="288" height="392" rx="12" fill="url(#panel)" stroke="#2a3a4d" stroke-width="1.5"/>
    <text x="16" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5eb8a8" letter-spacing="1">PER-PROJECT  .brain/</text>

    <rect x="16" y="40" width="256" height="124" rx="10" fill="#141c28" stroke="#5eb8a8" stroke-width="1.3"/>
    <ellipse cx="50" cy="78" rx="16" ry="10" fill="#1a2332" stroke="#3d9a8b" stroke-width="1.3"/>
    <rect x="34" y="78" width="32" height="22" fill="#1a2332" stroke="#3d9a8b" stroke-width="1.3"/>
    <ellipse cx="50" cy="100" rx="16" ry="10" fill="#1a2332" stroke="#3d9a8b" stroke-width="1.3"/>
